<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>플로우갓의 채팅방 v38 COMBO FIX</title>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
:root{--yellow:#FEE500;--bg:#FFFFFF;--chat-bg:#B2C7D9;--bubble-me:#FEE500;--bubble-other:#FFFFFF;--ink:#191919;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans KR',Apple SD Gothic Neo,sans-serif;background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column;overflow:hidden;}
header{height:52px;background:var(--yellow);display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-weight:800;font-size:18px;letter-spacing:-0.3px;flex-shrink:0;}
header .sub{font-size:12px;font-weight:600;opacity:0.7;margin-left:8px;}
#chat{flex:1;background:var(--chat-bg);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;}
.bubble{max-width:72%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.4;position:relative;word-break:break-word;}
.bubble.other{background:var(--bubble-other);align-self:flex-start;border-top-left-radius:4px;}
.bubble.me{background:var(--bubble-me);align-self:flex-end;border-top-right-radius:4px;}
.bubble .meta{font-size:10px;opacity:0.55;margin-bottom:4px;display:flex;gap:6px;align-items:center;}
.bubble .emoji-big{font-size:28px;}
#inputBar{height:56px;background:#FFF;display:flex;align-items:center;gap:8px;padding:0 12px;border-top:1px solid #E8E8E8;flex-shrink:0;}
#inputBar input{flex:1;height:38px;border-radius:19px;border:1px solid #E6E6E6;background:#F6F6F6;padding:0 16px;font-size:14px;outline:none;}
#inputBar button{height:38px;padding:0 16px;border-radius:19px;border:none;background:var(--yellow);font-weight:700;font-size:14px;cursor:pointer;}
#charBar{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:#FFF;border-top:1px solid #F0F0F0;flex-shrink:0;}
#charBar::-webkit-scrollbar{display:none;}
.char{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;border:2px solid transparent;flex-shrink:0;background:#F9F9F9;}
.char.active{border-color:var(--yellow);background:#FFF9BF;}
#emoTabs{display:flex;gap:4px;padding:8px 12px;background:#FFF;border-top:1px solid #F0F0F0;overflow-x:auto;flex-shrink:0;}
#emoTabs::-webkit-scrollbar{display:none;}
.tab{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;background:#F2F2F2;}
.tab.active{background:var(--ink);color:#FFF;}
#emoGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:10px 12px;background:#FAFAFA;max-height:164px;overflow-y:auto;flex-shrink:0;}
.emo{padding:10px 6px;border-radius:12px;background:#FFF;border:1px solid #EEEEEE;text-align:center;font-size:13px;cursor:pointer;user-select:none;transition:transform 0.08s;}
.emo:active{transform:scale(0.94);}
.emo span{display:block;font-size:20px;margin-bottom:2px;}
.combo-rain{position:fixed;inset:0;pointer-events:none;z-index:9999;}
.rain-item{position:absolute;top:-40px;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);}}
.float-emoji{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);font-size:64px;animation:floatUp 1.6s ease-out forwards;pointer-events:none;z-index:10000;}
@keyframes floatUp{0%{transform:translateX(-50%) translateY(0) scale(0.6);opacity:0;}15%{opacity:1;}100%{transform:translateX(-50%) translateY(-260px) scale(1.3);opacity:0;}}
.combo-badge{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:#191919;color:#FEE500;padding:8px 16px;border-radius:999px;font-weight:800;font-size:14px;z-index:10001;animation:pop 0.6s ease;}
@keyframes pop{0%{transform:translateX(-50%) scale(0.5);}50%{transform:translateX(-50%) scale(1.15);}100%{transform:translateX(-50%) scale(1);}}
</style>
</head>
<body>
<header>
<div style="display:flex;align-items:center;">플로우갓의 채팅방 <span class="sub">v38 COMBO FIX FULL</span></div>
<div style="font-size:11px;background:#191919;color:#FEE500;padding:4px 8px;border-radius:999px;">LIVE</div>
</header>
<div id="chat"></div>
<div id="charBar"></div>
<div id="emoTabs"></div>
<div id="emoGrid"></div>
<div id="inputBar">
<input id="msgInput" placeholder="메시지를 입력하세요..."/>
<button id="sendBtn">전송</button>
</div>

<script>
// ===== v38 COMBO FIX FULL CONFIG =====
const COMBO_COUNT = 3;
const COMBO_WINDOW = 2000;
const CHARACTERS = ['🐻','🐱','🐶','🐰','🦊','🐼','🐨','🐯','🐸','🐵','🦁','🐧'];

const EMOTICONS = {
  '감사': [
    {e:'🙏', t:'감사해요'},
    {e:'💛', t:'고마워요'},
    {e:'🥹', t:'감동이에요'},
    {e:'🫶', t:'사랑해요 감사'},
    {e:'✨', t:'은혜에요'},
    {e:'😭', t:'눈물나게 감사'}
  ],
  '찬양': [
    {e:'🙌', t:'할렐루야'},
    {e:'👏', t:'찬양해요'},
    {e:'🔥', t:'불타는찬양'},
    {e:'💃', t:'춤추며찬양'},
    {e:'🎤', t:'목놓아찬양'},
    {e:'⭐', t:'영광돌려요'}
  ],
  '기쁨': [
    {e:'😆', t:'너무기뻐'},
    {e:'🤣', t:'웃음팡'},
    {e:'😁', t:'행복해요'},
    {e:'🥳', t:'파티타임'},
    {e:'😊', t:'미소천사'},
    {e:'🤩', t:'신나요'}
  ],
  '슬픔': [
    {e:'😢', t:'슬퍼요'},
    {e:'😭', t:'울고싶어'},
    {e:'🥺', t:'서운해요'},
    {e:'😞', t:'힘들어요'},
    {e:'💧', t:'눈물줄줄'},
    {e:'😿', t:'속상해'}
  ],
  '사랑': [
    {e:'❤️', t:'사랑해요'},
    {e:'💕', t:'하트뿅뿅'},
    {e:'😍', t:'반했어요'},
    {e:'💋', t:'쪽'},
    {e:'🫂', t:'안아줘요'},
    {e:'💌', t:'러브레터'}
  ],
  '응원': [
    {e:'💪', t:'화이팅'},
    {e:'🔥', t:'응원해요'},
    {e:'🙏', t:'기도해요'},
    {e:'✨', t:'힘내요'},
    {e:'🌈', t:'잘될거야'},
    {e:'👍', t:'최고야'}
  ]
};

let currentChar = CHARACTERS[0];
let currentCategory = '감사';
let lastEmoji = null;
let comboCount = 0;
let lastTime = 0;
let currentUser = '나';
let socket = null;

try {
  socket = io();
  socket.on('connect', function(){ addSystem('서버 연결됨 v38'); });
  socket.on('chatMessage', function(data){ addOther(data); });
  socket.on('emojiMessage', function(data){ addOther(data); });
  // COMBO FIX LISTENERS
  socket.on('emojiComboRain', function(data){
    showComboRain(data.emoji);
    showComboBadge(data.emoji + ' COMBO x' + data.count);
  });
  socket.on('emojiFloat', function(data){
    showEmojiFloat(data.emoji);
  });
} catch(e){
  console.log('socket offline, local mode');
}

function $(s){ return document.querySelector(s); }

function initChars(){
  var bar = $('#charBar');
  CHARACTERS.forEach(function(c){
    var d = document.createElement('div');
    d.className = 'char' + (c===currentChar?' active':'');
    d.textContent = c;
    d.onclick = function(){
      currentChar = c;
      document.querySelectorAll('.char').forEach(function(x){ x.classList.remove('active'); });
      d.classList.add('active');
    };
    bar.appendChild(d);
  });
}

function initTabs(){
  var tabs = $('#emoTabs');
  Object.keys(EMOTICONS).forEach(function(cat){
    var b = document.createElement('div');
    b.className = 'tab' + (cat===currentCategory?' active':'');
    b.textContent = cat;
    b.onclick = function(){
      currentCategory = cat;
      document.querySelectorAll('.tab').forEach(function(x){ x.classList.remove('active'); });
      b.classList.add('active');
      renderGrid();
    };
    tabs.appendChild(b);
  });
}

function renderGrid(){
  var grid = $('#emoGrid');
  grid.innerHTML = '';
  EMOTICONS[currentCategory].forEach(function(item){
    var el = document.createElement('div');
    el.className = 'emo';
    el.innerHTML = '<span>'+item.e+'</span>'+item.t;
    el.onclick = function(){ sendEmo(item.e + ' ' + item.t, item.e); };
    grid.appendChild(el);
  });
}

function trackEmojiCombo(emoji){
  var now = Date.now();
  if(lastEmoji === emoji && (now - lastTime) < COMBO_WINDOW){
    comboCount += 1;
  } else {
    comboCount = 1;
  }
  lastEmoji = emoji;
  lastTime = now;

  if(comboCount >= COMBO_COUNT){
    var payload = { emoji: emoji, count: comboCount, user: currentUser, char: currentChar };
    if(socket){
      socket.emit('emojiComboRain', payload);
      socket.emit('emojiFloat', payload);
    }
    // local fallback
    showComboRain(emoji);
    showEmojiFloat(emoji);
    showComboBadge(emoji + ' COMBO x' + comboCount + '!');
    comboCount = 0;
  }
}

function showComboRain(emoji){
  var container = document.createElement('div');
  container.className = 'combo-rain';
  document.body.appendChild(container);
  for(var i=0;i<18;i++){
    var s = document.createElement('div');
    s.className = 'rain-item';
    s.textContent = emoji;
    s.style.left = Math.random()*100 + 'vw';
    s.style.fontSize = (18 + Math.random()*26) + 'px';
    s.style.animationDuration = (0.9 + Math.random()*1.2) + 's';
    s.style.animationDelay = (Math.random()*0.3) + 's';
    container.appendChild(s);
  }
  setTimeout(function(){ container.remove(); }, 2200);
}

function showEmojiFloat(emoji){
  var f = document.createElement('div');
  f.className = 'float-emoji';
  f.textContent = emoji;
  document.body.appendChild(f);
  setTimeout(function(){ f.remove(); }, 1600);
}

function showComboBadge(text){
  var b = document.createElement('div');
  b.className = 'combo-badge';
  b.textContent = text;
  document.body.appendChild(b);
  setTimeout(function(){ b.remove(); }, 1400);
}

function addMe(text){
  var c = $('#chat');
  var d = document.createElement('div');
  d.className = 'bubble me';
  d.innerHTML = '<div class="meta">'+currentChar+' 나</div>' + text;
  c.appendChild(d);
  c.scrollTop = c.scrollHeight;
}

function addOther(data){
  var c = $('#chat');
  var d = document.createElement('div');
  d.className = 'bubble other';
  var char = data.char || '🐻';
  var user = data.user || '익명';
  var msg = data.text || data.message || '';
  d.innerHTML = '<div class="meta">'+char+' '+user+'</div>' + msg;
  c.appendChild(d);
  c.scrollTop = c.scrollHeight;
}

function addSystem(text){
  var c = $('#chat');
  var d = document.createElement('div');
  d.style.textAlign='center';
  d.style.fontSize='11px';
  d.style.color='#6B6B6B';
  d.style.margin='6px 0';
  d.textContent = text;
  c.appendChild(d);
}

function sendEmo(text, emojiChar){
  var payload = { text: text, user: currentUser, char: currentChar, emoji: emojiChar };
  addMe(text);
  if(socket){
    socket.emit('emojiMessage', payload);
  }
  trackEmojiCombo(emojiChar);
}

$('#sendBtn').onclick = function(){
  var v = $('#msgInput').value.trim();
  if(!v) return;
  var payload = { text: v, user: currentUser, char: currentChar };
  addMe(v);
  if(socket) socket.emit('chatMessage', payload);
  $('#msgInput').value = '';
};

$('#msgInput').addEventListener('keydown', function(e){
  if(e.key === 'Enter') $('#sendBtn').click();
});

initChars();
initTabs();
renderGrid();
addSystem('v38 COMBO FIX FULL 로드됨 - 이모티콘 36개 / 캐릭터 12개 / COMBO_COUNT=3');
</script>
</body>
</html>
