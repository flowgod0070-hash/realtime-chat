<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="/manifest.json?v=12">
<link rel="apple-touch-icon" href="/my-icon-180.png?v=12">
<title>플로우갓의 채팅방</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="플로우갓의 채팅방">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#fff;height:100dvh;display:flex;justify-content:center;align-items:center;margin:0;padding:0;padding-top:env(safe-area-inset-top)}
.app{width:100%;max-width:420px;height:100dvh;height:calc(100dvh - env(safe-area-inset-top));background:#fff;display:flex;flex-direction:column;position:relative;overflow:hidden}
@media(min-width:500px){.app{height:90dvh;border-radius:24px;box-shadow:0 10px 40px rgba(0,0,0,.1)}}
.header{background:#ffffffcc;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:8px;border-bottom:1px solid #f0f0f0;position:sticky;top:0;z-index:10}
.headerTop{display:flex;justify-content:space-between;align-items:center}
.header b{font-size:17px}
.bgmBar{display:flex;align-items:center;gap:8px;background:#f5f5f5;padding:8px 12px;border-radius:12px;font-size:13px;flex-wrap:wrap}
.bgmBar select{padding:4px 8px;border-radius:8px;border:1px solid #ddd;font-size:12px}
.bgmBar input[type=range]{flex:1;min-width:60px;max-width:90px}
.bgmBar button{padding:4px 8px;border:none;border-radius:8px;background:#fff;border:1px solid #ddd;cursor:pointer;font-size:12px}
.login{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px;gap:16px;background:#fff}
.login h1{font-size:24px;line-height:1.3}
.login input{padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px}
.login button{padding:14px;background:#FEE500;border:none;border-radius:12px;font-weight:700;font-size:16px;cursor:pointer}
.chars{display:flex;gap:8px;flex-wrap:wrap}
.char{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:#f5f5f5;cursor:pointer;border:2px solid transparent;transition:.15s}
.char.sel{border-color:#000;background:#FEE500;transform:scale(1.1)}
.messages{flex:1;overflow-y:auto;padding:16px;background:#ABC1D1;display:flex;flex-direction:column;gap:10px}
.msg{max-width:78%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-break:keep-all;overflow-wrap:break-word;animation:pop .2s}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.msg.me{align-self:flex-end;background:#FEE500;border-bottom-right-radius:4px}
.msg.other{align-self:flex-start;background:#fff;border-bottom-left-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.msg .sender{font-size:12px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:4px}
.msg .meta{font-size:10px;color:#888;margin-top:4px}
.system{align-self:center;background:rgba(0,0,0,.2);color:#fff;padding:4px 12px;border-radius:20px;font-size:12px}
.inputArea{display:flex;gap:8px;padding:10px;background:#fff;border-top:1px solid #eee;align-items:center}
.inputArea input{flex:1;padding:12px 16px;border:none;background:#f2f2f2;border-radius:24px;font-size:15px;outline:none}
.iconBtn{width:40px;height:40px;border-radius:50%;border:none;background:#f2f2f2;display:grid;place-items:center;font-size:18px;cursor:pointer;transition:.15s}
.iconBtn:active{transform:scale(.92)}
.send{background:#FEE500}
</style>
</head>
<body>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister()));}
if(window.caches){caches.keys().then(ks=>ks.forEach(k=>caches.delete(k)));}
</script>
<div class="app" id="app"></div>
<audio id="bgmPlayer" loop preload="auto"></audio>
<audio id="enterSound" preload="auto"></audio>
<script src="/socket.io/socket.io.js"></script>
<script>
const appEl=document.getElementById('app');
let socket,myInfo,roomId='main-room';
let isComposing=false,isHost=false;
let currentTrack=localStorage.getItem('lastBgmTrack')||'bgm1.mp3';
let myVolume=parseFloat(localStorage.getItem('myBgmVolume')||'0.5');
let enterSoundEnabled=localStorage.getItem('enterSoundEnabled')!=='0';
const bgmList=['bgm1.mp3','bgm2.mp3','bgm3.mp3','bgm4.mp3','bgm5.mp3'];

function renderLogin(){
 appEl.innerHTML=`<div class="login"><h1>🐣 플로우갓의 채팅방 입장</h1><p style="color:#666;font-size:14px">아이폰·갤럭시 둘 다 설치 가능! 플로우갓의 채팅방 v12</p><input id="nameIn" placeholder="내 이름 (방장 포함하면 방장)" /><div><p style="font-size:13px;margin-bottom:8px">내 캐릭터</p><div class="chars" id="chars"></div></div><input id="roomIn" placeholder="방 이름" value="main-room"/><button onclick="enter()">입장하기 →</button><p style="font-size:11px;color:#888;margin-top:8px;line-height:1.5">📱 아이폰: 공유 → 홈 화면에 추가<br>갤럭시: 메뉴 → 홈 화면에 추가<br>🔊 볼륨은 개인 조절, BGM 변경은 방장만</p></div>`;
 const emojis=['🐻','🐱','🐶','🐰','🦊','🐼','🐨','🐯','🐸','🐵','🦁','🐧'];
 let sel=emojis[0];
 const wrap=document.getElementById('chars');
 emojis.forEach(e=>{const d=document.createElement('div');d.className='char'+(e===sel?' sel':'');d.textContent=e;d.onclick=()=>{sel=e;document.querySelectorAll('.char').forEach(c=>c.classList.remove('sel'));d.classList.add('sel')};wrap.appendChild(d);});
 window._sel=()=>sel;
}
function enter(){
 const name=document.getElementById('nameIn').value.trim(); if(!name) return alert('이름 입력해줘');
 const room=document.getElementById('roomIn').value.trim()||'main-room'; roomId=room;
 myInfo={username:name,character:window._sel(),roomId};
 isHost=name.includes('방장')||name.includes('플로우갓')||name.includes('관리자');
 if(isHost) localStorage.setItem('isHost-'+roomId,'1'); else if(localStorage.getItem('isHost-'+roomId)) isHost=true;
 initSocket(); renderChat(); initBgm();
}
function playEnterSound(){
 if(!enterSoundEnabled) return;
 try{
   const ctx=new (window.AudioContext||window.webkitAudioContext)();
   const vol=ctx.createGain(); vol.gain.value=myVolume*0.7; vol.connect(ctx.destination);
   [0,120].forEach((d,i)=>setTimeout(()=>{const o=ctx.createOscillator();o.type='sine';o.frequency.value=i===0?784:1046;o.connect(vol);o.start();o.stop(ctx.currentTime+0.22);},d));
 }catch(e){}
}
function initSocket(){
 socket=io();
 socket.emit('joinRoom',myInfo);
 socket.on('chatMessage',d=>addMsg(d));
 socket.on('fileMessage',d=>addFileMsg(d));
 socket.on('voiceMessage',d=>addVoiceMsg(d));
 socket.on('systemMessage',txt=>{addSystem(txt); if((txt.includes('들어왔')||txt.includes('입장'))&&!txt.includes(myInfo.username)) playEnterSound();});
 socket.on('userJoined',data=>{if(data.username!==myInfo.username){addSystem(`🔔 ${data.character||'🐣'} ${data.username}님이 들어왔습니다.`); playEnterSound();}});
 socket.on('userLeft',data=>addSystem(`👋 ${data.username}님이 나갔습니다.`));
 socket.on('bgmTrackChange',track=>{if(bgmList.includes(track)){currentTrack=track;const p=document.getElementById('bgmPlayer');const was=!p.paused;p.src='/'+track+'?v=12';localStorage.setItem('lastBgmTrack',track);updateBgmSelect();if(was)p.play().catch(()=>{});addSystem(`🎵 BGM 변경: ${track} (방장)`);}});
}
function renderChat(){
 appEl.innerHTML=`<div class="header"><div class="headerTop"><b>${myInfo.character} ${myInfo.username} · ${roomId} ${isHost?'👑':''}</b><span style="font-size:12px;color:#888">플로우갓의 채팅방</span></div><div id="bgmBarWrap"></div></div><div class="messages" id="msgs"></div><div class="inputArea"><button class="iconBtn" onclick="document.getElementById('fileIn').click()">📎</button><input id="fileIn" type="file" hidden onchange="sendFile(this.files[0])"/><input id="textIn" placeholder="메시지 입력" autocomplete="off"/><button class="iconBtn" id="micBtn" onclick="toggleVoice()">🎤</button><button class="iconBtn send" onclick="sendText()">↑</button></div>`;
 const ti=document.getElementById('textIn'); ti.focus();
 ti.addEventListener('compositionstart',()=>isComposing=true);
 ti.addEventListener('compositionend',()=>setTimeout(()=>isComposing=false,100));
 ti.addEventListener('keydown',e=>{if(e.key==='Enter'){if(isComposing||e.isComposing||e.keyCode===229) return; e.preventDefault(); sendText();}});
 renderBgmBar();
}
function renderBgmBar(){
 const w=document.getElementById('bgmBarWrap'); if(!w) return;
 const hostCtrl=isHost?`<select id="bgmSelect" onchange="changeTrack(this.value)">${bgmList.map(t=>`<option value="${t}" ${t===currentTrack?'selected':''}>${t}</option>`).join('')}</select><span style="font-size:11px;color:#666">방장전용</span>`:`<span style="font-size:12px">🎵 ${currentTrack}</span>`;
 w.innerHTML=`<div class="bgmBar"><button id="bgmPlayBtn" onclick="toggleBgm()">▶</button>${hostCtrl}<span style="margin-left:auto">🔊</span><input type="range" id="volSlider" min="0" max="1" step="0.01" value="${myVolume}" oninput="changeMyVolume(this.value)"><button onclick="toggleBgmMute()">🔇</button><button onclick="toggleEnterSound()" id="enterBtn">${enterSoundEnabled?'🔔':'🔕'}</button></div><div style="font-size:10px;color:#888;margin-top:4px">볼륨 개인조절 | BGM 변경 방장만 | 알람 ${enterSoundEnabled?'ON':'OFF'}</div>`;
}
function toggleEnterSound(){enterSoundEnabled=!enterSoundEnabled; localStorage.setItem('enterSoundEnabled',enterSoundEnabled?'1':'0'); const b=document.getElementById('enterBtn'); if(b) b.textContent=enterSoundEnabled?'🔔':'🔕'; if(enterSoundEnabled) playEnterSound();}
function updateBgmSelect(){const s=document.getElementById('bgmSelect'); if(s) s.value=currentTrack;}
function initBgm(){const p=document.getElementById('bgmPlayer'); p.src='/'+currentTrack+'?v=12'; p.volume=myVolume; p.play().catch(()=>{});}
function toggleBgm(){const p=document.getElementById('bgmPlayer'); if(p.paused){p.play().then(()=>{document.getElementById('bgmPlayBtn').textContent='⏸';}).catch(()=>{});} else {p.pause();document.getElementById('bgmPlayBtn').textContent='▶';}}
function changeTrack(t){if(!isHost) return alert('방장만 가능!'); currentTrack=t; const p=document.getElementById('bgmPlayer'); const was=!p.paused; p.src='/'+t+'?v=12'; localStorage.setItem('lastBgmTrack',t); if(was)p.play().catch(()=>{}); socket.emit('bgmTrackChange',t); addSystem(`🎵 BGM 변경: ${t}`);}
function changeMyVolume(v){myVolume=parseFloat(v); document.getElementById('bgmPlayer').volume=myVolume; localStorage.setItem('myBgmVolume',myVolume);}
function toggleBgmMute(){const p=document.getElementById('bgmPlayer'); const s=document.getElementById('volSlider'); if(p.volume>0){s.dataset.prev=p.volume; changeMyVolume(0); s.value=0;} else {const prev=parseFloat(s.dataset.prev||'0.5'); changeMyVolume(prev); s.value=prev;}}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function addMsg(d){const me=d.username===myInfo.username; const el=document.createElement('div'); el.className=me?'msg me':'msg other'; el.innerHTML=`<div class="sender">${d.character} ${esc(d.username)}</div><div>${esc(d.text)}</div><div class="meta">${new Date(d.id||Date.now()).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}</div>`; document.getElementById('msgs').appendChild(el); scroll();}
function addSystem(t){const el=document.createElement('div'); el.className='system'; el.textContent=t; const m=document.getElementById('msgs'); if(m){m.appendChild(el); scroll();}}
function addFileMsg(d){const me=d.username===myInfo.username; const el=document.createElement('div'); el.className=me?'msg me':'msg other'; el.innerHTML=`<div class="sender">${d.character} ${esc(d.username)}</div><div>📄 ${esc(d.fileName)} (${Math.round(d.size/1024)}KB)</div><a href="${d.dataUrl}" download="${d.fileName}" style="font-size:12px;color:#007AFF">다운로드</a>`; document.getElementById('msgs').appendChild(el); scroll();}
function addVoiceMsg(d){const me=d.username===myInfo.username; const el=document.createElement('div'); el.className=me?'msg me':'msg other'; el.innerHTML=`<div class="sender">${d.character} ${esc(d.username)}</div><div style="display:flex;align-items:center;gap:8px"><button onclick="new Audio('${d.dataUrl}').play()" style="padding:6px 12px;border-radius:20px;border:none;background:#fff">▶ ${d.duration}s 음성</button></div>`; document.getElementById('msgs').appendChild(el); scroll();}
function scroll(){const m=document.getElementById('msgs'); if(m) m.scrollTop=m.scrollHeight;}
function sendText(){if(isComposing) return; const inp=document.getElementById('textIn'); let t=inp.value.trim(); if(!t) return; t=t.replace(/\s+/g,' '); socket.emit('chatMessage',{...myInfo,text:t}); inp.value=''; inp.focus();}
function sendFile(f){if(!f) return; const r=new FileReader(); r.onload=()=>{socket.emit('fileMessage',{...myInfo,fileName:f.name,size:f.size,dataUrl:r.result});}; r.readAsDataURL(f);}
let rec,chunks=[],startT;
async function toggleVoice(){
 const btn=document.getElementById('micBtn');
 if(rec&&rec.state==='recording'){rec.stop(); btn.textContent='🎤'; btn.style.background=''; return;}
 const stream=await navigator.mediaDevices.getUserMedia({audio:true});
 rec=new MediaRecorder(stream); chunks=[]; startT=Date.now();
 rec.ondataavailable=e=>chunks.push(e.data);
 rec.onstop=()=>{const blob=new Blob(chunks,{type:'audio/webm'}); const r=new FileReader(); r.onload=()=>{socket.emit('voiceMessage',{...myInfo,dataUrl:r.result,duration:Math.round((Date.now()-startT)/1000)});}; r.readAsDataURL(blob);};
 rec.start(); btn.textContent='⏹'; btn.style.background='#ff4444';
}
renderLogin();
</script>
</body>
</html>
