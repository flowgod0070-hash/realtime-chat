<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="/manifest.json?v=14">
<link rel="apple-touch-icon" href="/my-icon-180.png?v=14">
<title>플로우갓의 채팅방</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-title" content="플로우갓의 채팅방">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#fff;height:100dvh;display:flex;justify-content:center;align-items:center;padding-top:env(safe-area-inset-top)}
.app{width:100%;max-width:420px;height:100dvh;height:calc(100dvh - env(safe-area-inset-top));background:#fff;display:flex;flex-direction:column;position:relative;overflow:hidden}
@media(min-width:500px){.app{height:90dvh;border-radius:24px;box-shadow:0 10px 40px rgba(0,0,0,.1)}}
.header{background:#ffffffee;backdrop-filter:blur(20px);padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:8px;border-bottom:1px solid #f0f0f0;z-index:10}
.headerTop{display:flex;justify-content:space-between;align-items:center}
.header b{font-size:16px}
.bgmBar{display:flex;align-items:center;gap:6px;background:#f5f5f7;padding:8px 10px;border-radius:12px;font-size:12px;flex-wrap:wrap}
.bgmBar select{padding:5px 8px;border-radius:8px;border:1px solid #ddd;font-size:12px;background:#fff}
.bgmBar input[type=range]{flex:1;min-width:50px;max-width:80px}
.bgmBar button{padding:5px 8px;border:none;border-radius:8px;background:#fff;border:1px solid #ddd;cursor:pointer;font-size:12px}
.emojiBarWrap{background:#fafafa;border-bottom:1px solid #eee}
.quickBar{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;scrollbar-width:none;align-items:center}
.quickBar::-webkit-scrollbar{display:none}
.emoBtn{flex:0 0 auto;padding:7px 12px;border-radius:20px;border:1px solid #eee;background:#fff;font-size:13px;cursor:pointer;white-space:nowrap;transition:.15s;font-weight:500}
.emoBtn:active{transform:scale(.92);background:#FEE500}
.emoToggle{flex:0 0 auto;padding:7px 12px;border-radius:20px;background:#000;color:#fff;font-size:12px;border:none;cursor:pointer}
.emoPanel{display:none;background:#fff;padding:10px;border-top:1px solid #eee}
.emoPanel.show{display:block}
.catTabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.catTabs::-webkit-scrollbar{display:none}
.catTab{padding:6px 14px;border-radius:20px;border:1px solid #eee;background:#f5f5f5;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.15s}
.catTab.active{background:#000;color:#fff;border-color:#000}
.emoGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.emoCard{padding:12px 8px;border:1px solid #eee;border-radius:14px;background:#fff;text-align:center;cursor:pointer;transition:.15s}
.emoCard:active{transform:scale(.95);background:#FEE500}
.emoCard .e{font-size:22px;display:block;margin-bottom:4px}
.emoCard .t{font-size:12px;font-weight:600;color:#333}
.login{flex:1;display:flex;flex-direction:column;justify-content:center;padding:28px;gap:14px;background:#fff;overflow-y:auto}
.login h1{font-size:23px;line-height:1.3}
.login input{padding:13px;border:1px solid #ddd;border-radius:12px;font-size:16px}
.login button{padding:13px;background:#FEE500;border:none;border-radius:12px;font-weight:700;font-size:16px;cursor:pointer}
.chars{display:flex;gap:8px;flex-wrap:wrap}
.char{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:#f5f5f5;cursor:pointer;border:2px solid transparent;transition:.15s}
.char.sel{border-color:#000;background:#FEE500;transform:scale(1.1)}
.messages{flex:1;overflow-y:auto;padding:14px;background:#ABC1D1;display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-break:keep-all;overflow-wrap:break-word;animation:pop .2s}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.msg.me{align-self:flex-end;background:#FEE500;border-bottom-right-radius:4px}
.msg.other{align-self:flex-start;background:#fff;border-bottom-left-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.msg .sender{font-size:12px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:4px}
.msg .meta{font-size:10px;color:#888;margin-top:4px}
.msg img.chatImg{max-width:100%;max-height:260px;border-radius:12px;margin-top:6px;cursor:pointer;display:block}
.system{align-self:center;background:rgba(0,0,0,.22);color:#fff;padding:4px 12px;border-radius:20px;font-size:12px}
.inputArea{display:flex;gap:6px;padding:10px;background:#fff;border-top:1px solid #eee;align-items:center}
.inputArea input{flex:1;padding:12px 14px;border:none;background:#f2f2f2;border-radius:24px;font-size:15px;outline:none}
.iconBtn{width:40px;height:40px;border-radius:50%;border:none;background:#f2f2f2;display:grid;place-items:center;font-size:18px;cursor:pointer;transition:.15s;flex:0 0 40px}
.iconBtn:active{transform:scale(.92)}
.send{background:#FEE500}
#imgModal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;justify-content:center;align-items:center;z-index:9999;flex-direction:column;gap:12px;padding:20px}
#imgModal.show{display:flex}
#imgModal img{max-width:95vw;max-height:80vh;border-radius:12px}
#imgModal .modalBtns{display:flex;gap:10px}
#imgModal .modalBtns button{padding:10px 18px;border-radius:20px;border:none;font-size:14px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister()));}
if(window.caches){caches.keys().then(ks=>ks.forEach(k=>caches.delete(k)));}
</script>
<div class="app" id="app"></div>
<div id="imgModal" onclick="closeModal(event)"><img id="modalImg" src=""><div class="modalBtns"><a id="modalDown" download style="text-decoration:none"><button style="background:#FEE500">📥 다운로드</button></a><button onclick="document.getElementById('imgModal').classList.remove('show')" style="background:#fff">✖ 닫기</button></div></div>
<audio id="bgmPlayer" loop preload="auto"></audio>
<script src="/socket.io/socket.io.js"></script>
<script>
const appEl=document.getElementById('app');
let socket,myInfo,roomId='main-room';
let isComposing=false,isHost=false;
let currentTrack=localStorage.getItem('lastBgmTrack')||'bgm1.mp3';
let myVolume=parseFloat(localStorage.getItem('myBgmVolume')||'0.5');
let enterSoundEnabled=localStorage.getItem('enterSoundEnabled')!=='0';
const bgmList=['bgm1.mp3','bgm2.mp3','bgm3.mp3','bgm4.mp3','bgm5.mp3'];
const emoticonCategories = {
  '감사': [
    {emoji:'🙏', text:'감사해요', full:'🙏 감사해요!'},
    {emoji:'🥹', text:'고마워요', full:'🥹 너무 고마워요!'},
    {emoji:'🙇', text:'감사합니다', full:'🙇 감사합니다!'},
    {emoji:'💝', text:'진심감사', full:'💝 진심으로 감사해요'},
    {emoji:'🤲', text:'감사기도', full:'🤲 감사기도 드려요'},
    {emoji:'🌸', text:'고마운마음', full:'🌸 고마운 마음이에요'},
  ],
  '찬양': [
    {emoji:'🙌', text:'할렐루야', full:'🙌 할렐루야!'},
    {emoji:'👏', text:'찬양해요', full:'👏 하나님 찬양해요!'},
    {emoji:'✨', text:'영광', full:'✨ 하나님께 영광!'},
    {emoji:'🎤', text:'찬양합니다', full:'🎤 찬양합니다!'},
    {emoji:'🔥', text:'찬양불타', full:'🔥 찬양이 불타오르네요!'},
    {emoji:'👑', text:'주님은왕', full:'👑 주님은 왕이세요!'},
  ],
  '기쁨': [
    {emoji:'😊', text:'기뻐요', full:'😊 너무 기뻐요!'},
    {emoji:'🎉', text:'기쁨충만', full:'🎉 기쁨이 충만해요!'},
    {emoji:'😂', text:'웃겨요', full:'😂 너무 웃겨요ㅋㅋ'},
    {emoji:'🥳', text:'축하해요', full:'🥳 축하해요!'},
    {emoji:'🤣', text:'빵터짐', full:'🤣 빵터졌어요!'},
    {emoji:'🌈', text:'행복해', full:'🌈 행복해요!'},
  ],
  '슬픔': [
    {emoji:'😢', text:'슬퍼요', full:'😢 슬퍼요...'},
    {emoji:'😭', text:'눈물나', full:'😭 눈물이 나요...'},
    {emoji:'🕊️', text:'위로해요', full:'🕊️ 위로해요...'},
    {emoji:'🤗', text:'안아줄게', full:'🤗 안아줄게요'},
    {emoji:'💧', text:'눈물', full:'💧 같이 울어요'},
    {emoji:'🌧️', text:'마음아파', full:'🌧️ 마음이 아파요'},
  ],
  '사랑': [
    {emoji:'❤️', text:'사랑해요', full:'❤️ 사랑해요!'},
    {emoji:'💕', text:'사랑해', full:'💕 사랑해요'},
    {emoji:'🫶', text:'하트줘요', full:'🫶 하트 드려요!'},
    {emoji:'💞', text:'사랑가득', full:'💞 사랑이 가득해요'},
    {emoji:'😍', text:'좋아요', full:'😍 너무 좋아요!'},
    {emoji:'🥰', text:'사랑해요', full:'🥰 사랑합니다!'},
  ],
  '응원': [
    {emoji:'💪', text:'힘내요', full:'💪 힘내세요!'},
    {emoji:'🙏', text:'기도해요', full:'🙏 기도할게요!'},
    {emoji:'🔥', text:'화이팅', full:'🔥 화이팅!'},
    {emoji:'🌟', text:'응원해', full:'🌟 응원해요!'},
    {emoji:'💯', text:'최고예요', full:'💯 최고예요!'},
    {emoji:'🚀', text:'잘될거야', full:'🚀 잘 될 거예요!'},
  ],
};
let currentEmoCat = '감사';
const quickEmojis = ['🙏 감사해요','🙌 할렐루야','😊 기뻐요','😢 슬퍼요','❤️ 사랑해요','💪 힘내요'];
function renderLogin(){
 appEl.innerHTML=`<div class="login"><h1>🐣 플로우갓의 채팅방 입장</h1><p style="color:#666;font-size:13px">아이폰·갤럭시 둘 다 설치 가능! 플로우갓의 채팅방 v14<br>BGM 5곡 + 사진 확대 + 이모티콘 복구!</p><input id="nameIn" placeholder="내 이름 (방장 포함하면 방장 권한)" /><div><p style="font-size:13px;margin-bottom:8px">내 캐릭터</p><div class="chars" id="chars"></div></div><input id="roomIn" placeholder="방 이름" value="main-room"/><button onclick="enter()">입장하기 →</button><p style="font-size:11px;color:#888;line-height:1.5">📱 아이폰: 공유 → 홈 화면에 추가<br>🔊 볼륨 개인조절, BGM 5곡 방장만 변경<br>📎 사진 클릭하면 확대/다운로드</p></div>`;
 const emojis=['🐻','🐱','🐶','🐰','🦊','🐼','🐨','🐯','🐸','🐵','🦁','🐧'];
 let sel=emojis[0];
 const wrap=document.getElementById('chars');
 emojis.forEach(e=>{const d=document.createElement('div');d.className='char'+(e===sel?' sel':'');d.textContent=e;d.onclick=()=>{sel=e;document.querySelectorAll('.char').forEach(c=>c.classList.remove('sel'));d.classList.add('sel')};wrap.appendChild(d);});
 window._sel=()=>sel;
}
function enter(){
 const name=document.getElementById('nameIn').value.trim(); if(!name) return alert('이름 입력');
 const room=document.getElementById('roomIn').value.trim()||'main-room'; roomId=room;
 myInfo={username:name,character:window._sel(),roomId};
 isHost=name.includes('방장')||name.includes('플로우갓')||name.includes('관리자')||name.toLowerCase().includes('cho')||name.toLowerCase().includes('flowgod');
 if(isHost) localStorage.setItem('isHost-'+roomId,'1'); else if(localStorage.getItem('isHost-'+roomId)) isHost=true;
 initSocket(); renderChat(); initBgm();
}
function playEnterSound(){
 if(!enterSoundEnabled) return;
 try{
   const ctx=new (window.AudioContext||window.webkitAudioContext)();
   const vol=ctx.createGain(); vol.gain.value=myVolume*0.6; vol.connect(ctx.destination);
   [0,140].forEach((d,i)=>setTimeout(()=>{const o=ctx.createOscillator();o.type='sine';o.frequency.value=i===0?784:1046;o.connect(vol);o.start();o.stop(ctx.currentTime+0.22);},d));
 }catch(e){}
}
function initSocket(){
 socket=io();
 socket.emit('joinRoom',myInfo);
 socket.on('chatMessage',d=>addMsg(d));
 socket.on('fileMessage',d=>addFileMsg(d));
 socket.on('voiceMessage',d=>addVoiceMsg(d));
 socket.on('systemMessage',txt=>{addSystem(txt); if((txt.includes('들어왔')||txt.includes('입장')||txt.includes('입장'))&&!txt.includes(myInfo.username)) playEnterSound();});
 socket.on('userJoined',data=>{if(data.username!==myInfo.username){addSystem(`🔔 ${data.character||'🐣'} ${data.username}님이 들어왔습니다.`); playEnterSound();}});
 socket.on('userLeft',data=>addSystem(`👋 ${data.username}님이 나갔습니다.`));
 socket.on('bgmTrackChange',track=>{if(bgmList.includes(track)){currentTrack=track;const p=document.getElementById('bgmPlayer');const was=!p.paused;p.src='/'+track+'?v=14';localStorage.setItem('lastBgmTrack',track);updateBgmSelect();if(was)p.play().catch(()=>{});addSystem(`🎵 BGM 변경: ${track}`);}});
}
function renderChat(){
 const quickHtml = quickEmojis.map(e=>`<button class="emoBtn" onclick="sendReaction('${e}')">${e}</button>`).join('');
 appEl.innerHTML=`<div class="header"><div class="headerTop"><b>${myInfo.character} ${myInfo.username} · ${roomId} ${isHost?'👑방장':''}</b><span style="font-size:11px;color:#888">플로우갓의 채팅방 v14</span></div><div id="bgmBarWrap"></div></div>
 <div class="emojiBarWrap">
   <div class="quickBar"><span style="font-size:11px;color:#888;font-weight:700;white-space:nowrap">빠른반응</span>${quickHtml}<button class="emoToggle" onclick="toggleEmoPanel()">😊 전체보기</button></div>
   <div class="emoPanel" id="emoPanel"></div>
 </div>
 <div class="messages" id="msgs"></div>
 <div class="inputArea"><button class="iconBtn" onclick="document.getElementById('fileIn').click()">📎</button><input id="fileIn" type="file" accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.zip" hidden onchange="sendFile(this.files[0])"/><input id="textIn" placeholder="메시지 입력" autocomplete="off"/><button class="iconBtn" id="micBtn" onclick="toggleVoice()">🎤</button><button class="iconBtn send" onclick="sendText()">↑</button></div>`;
 renderEmoPanel();
 const ti=document.getElementById('textIn'); ti.focus();
 ti.addEventListener('compositionstart',()=>isComposing=true);
 ti.addEventListener('compositionend',()=>setTimeout(()=>isComposing=false,80));
 ti.addEventListener('keydown',e=>{if(e.key==='Enter'){if(isComposing||e.isComposing||e.keyCode===229) return; e.preventDefault(); sendText();}});
 renderBgmBar();
 return;
}
function renderBgmBar(){
 const w=document.getElementById('bgmBarWrap'); if(!w) return;
 const options=bgmList.map(t=>`<option value="${t}" ${t===currentTrack?'selected':''}>${t.replace('.mp3','')} ${t===currentTrack?'▶':''}</option>`).join('');
 const hostCtrl=isHost?`<select id="bgmSelect" onchange="changeTrack(this.value)">${options}</select>`:`<span style="font-size:11px;background:#fff;padding:4px 8px;border-radius:8px">🎵 ${currentTrack} ${!isHost?'(방장만 변경)':''}</span>`;
 w.innerHTML=`<div class="bgmBar"><button id="bgmPlayBtn" onclick="toggleBgm()">▶ 재생</button>${hostCtrl}<span style="margin-left:auto">🔊 <span id="volLabel">${Math.round(myVolume*100)}%</span></span><input type="range" id="volSlider" min="0" max="1" step="0.01" value="${myVolume}" oninput="changeMyVolume(this.value)" style="flex:1; accent-color:#000"><button onclick="toggleBgmMute()">🔇</button><button onclick="toggleEnterSound()" id="enterBtn">${enterSoundEnabled?'🔔':'🔕'}</button></div><div style="font-size:10px;color:#888">볼륨 개인조절(누구나) | BGM 5곡 방장만 | ${isHost?'당신은 방장 👑':'일반 유저도 볼륨 조절 가능'} | 알람 ${enterSoundEnabled?'ON':'OFF'}</div>`;
}
function renderEmoPanel(){
  const panel=document.getElementById('emoPanel');
  if(!panel) return;
  const cats=Object.keys(emoticonCategories);
  const tabs=cats.map(c=>`<button class="catTab ${c===currentEmoCat?'active':''}" onclick="switchEmoCat('${c}')">${c}</button>`).join('');
  const items=emoticonCategories[currentEmoCat].map(it=>`<div class="emoCard" onclick="sendReaction('${it.full}')"><span class="e">${it.emoji}</span><span class="t">${it.text}</span></div>`).join('');
  panel.innerHTML=`<div class="catTabs">${tabs}</div><div class="emoGrid">${items}</div><div style="font-size:10px;color:#888;margin-top:8px;text-align:center">💡 ${currentEmoCat} 카테고리 · 탭을 눌러 다른 감정을 선택하세요</div>`;
}
function switchEmoCat(cat){ currentEmoCat=cat; renderEmoPanel(); }
function toggleEmoPanel(){
  const p=document.getElementById('emoPanel');
  if(!p) return;
  p.classList.toggle('show');
  if(p.classList.contains('show')) renderEmoPanel();
}
function toggleEnterSound(){enterSoundEnabled=!enterSoundEnabled; localStorage.setItem('enterSoundEnabled',enterSoundEnabled?'1':'0'); const b=document.getElementById('enterBtn'); if(b) b.textContent=enterSoundEnabled?'🔔':'🔕'; if(enterSoundEnabled) playEnterSound();}
function updateBgmSelect(){const s=document.getElementById('bgmSelect'); if(s) s.value=currentTrack;}
function initBgm(){
  const p=document.getElementById('bgmPlayer');
  if(!p){console.log('bgmPlayer 없음!'); return;}
  p.src='/'+currentTrack+'?v=14';
  p.volume=myVolume;
  p.preload='auto';
  console.log('BGM init',currentTrack,myVolume);
}
function toggleBgm(){
  const p=document.getElementById('bgmPlayer');
  if(!p) return;
  if(p.paused){
    p.volume=myVolume;
    p.play().then(()=>{
      const btn=document.getElementById('bgmPlayBtn');
      if(btn) btn.textContent='⏸ 정지';
      console.log('BGM playing vol',p.volume);
    }).catch(()=>alert('재생 버튼 다시 눌러주세요! (브라우저가 막음)'));
  } else {
    p.pause();
    const btn=document.getElementById('bgmPlayBtn');
    if(btn) btn.textContent='▶ 재생';
  }
}
function changeTrack(t){
  if(!isHost){alert('BGM 변경은 방장만! 이름에 방장 포함'); return;}
  currentTrack=t;
  const p=document.getElementById('bgmPlayer');
  const was=p && !p.paused;
  if(p){ p.src='/'+t+'?v=14'; p.volume=myVolume; if(was) p.play().catch(()=>{}); }
  localStorage.setItem('lastBgmTrack',t);
  if(socket) socket.emit('bgmTrackChange',t);
  addSystem(`🎵 BGM 변경: ${t} (방장)`);
}
function changeMyVolume(v){
  myVolume=parseFloat(v);
  const p=document.getElementById('bgmPlayer');
  if(p){
    p.volume=myVolume;
    p.muted=false;
    console.log('volume changed to',myVolume,'player vol',p.volume);
  }
  localStorage.setItem('myBgmVolume',myVolume);
  const label=document.getElementById('volLabel');
  if(label) label.textContent=Math.round(myVolume*100)+'%';
}
function toggleBgmMute(){
  const p=document.getElementById('bgmPlayer');
  const s=document.getElementById('volSlider');
  if(!p||!s) return;
  if(p.volume>0.01){
    s.dataset.prev=p.volume;
    changeMyVolume(0);
    s.value=0;
  } else {
    const prev=parseFloat(s.dataset.prev||'0.5');
    changeMyVolume(prev);
    s.value=prev;
  }
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function addMsg(d){const me=d.username===myInfo.username; const el=document.createElement('div'); el.className=me?'msg me':'msg other'; el.innerHTML=`<div class="sender">${d.character||'🐣'} ${esc(d.username)}</div><div>${esc(d.text)}</div><div class="meta">${new Date(d.id||Date.now()).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}</div>`; document.getElementById('msgs').appendChild(el); scroll();}
function addSystem(t){const el=document.createElement('div'); el.className='system'; el.textContent=t; const m=document.getElementById('msgs'); if(m){m.appendChild(el); scroll();}}
function addFileMsg(d){
 const me=d.username===myInfo.username;
 const isImg=d.dataUrl && d.dataUrl.startsWith('data:image');
 const el=document.createElement('div'); el.className=me?'msg me':'msg other';
 let content='';
 if(isImg){
   content=`<div>${esc(d.fileName)}</div><img class="chatImg" src="${d.dataUrl}" onclick="openModal('${d.dataUrl}','${esc(d.fileName)}')" alt="${esc(d.fileName)}"><div style="margin-top:6px;display:flex;gap:6px"><button onclick="openModal('${d.dataUrl}','${esc(d.fileName)}')" style="font-size:11px;padding:4px 8px;border-radius:12px;border:1px solid #ddd;background:#fff">🔍 확대</button><a href="${d.dataUrl}" download="${d.fileName}" style="font-size:11px;padding:4px 8px;border-radius:12px;border:1px solid #ddd;background:#fff;text-decoration:none;color:#000">📥 다운로드</a></div>`;
 } else {
   content=`<div>📄 ${esc(d.fileName)} (${Math.round((d.size||0)/1024)}KB)</div><a href="${d.dataUrl}" download="${d.fileName}" style="font-size:12px;color:#007AFF">📥 다운로드</a>`;
 }
 el.innerHTML=`<div class="sender">${d.character||'🐣'} ${esc(d.username)}</div>${content}<div class="meta">${new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}</div>`;
 document.getElementById('msgs').appendChild(el); scroll();
}
function addVoiceMsg(d){const me=d.username===myInfo.username; const el=document.createElement('div'); el.className=me?'msg me':'msg other'; el.innerHTML=`<div class="sender">${d.character||'🐣'} ${esc(d.username)}</div><div style="display:flex;align-items:center;gap:8px"><button onclick="new Audio('${d.dataUrl}').play()" style="padding:6px 12px;border-radius:20px;border:none;background:#fff">▶ ${d.duration||'?'}s 음성</button></div>`; document.getElementById('msgs').appendChild(el); scroll();}
function scroll(){const m=document.getElementById('msgs'); if(m) m.scrollTop=m.scrollHeight;}
function sendText(){if(isComposing) return; const inp=document.getElementById('textIn'); let t=inp.value.trim(); if(!t) return; t=t.replace(/\s+/g,' '); socket.emit('chatMessage',{...myInfo,text:t}); inp.value=''; inp.focus();}
function sendReaction(txt){socket.emit('chatMessage',{...myInfo,text:txt});}
function sendFile(f){if(!f) return; if(f.size>10*1024*1024) return alert('10MB 이하만 가능해요'); const r=new FileReader(); r.onload=()=>{socket.emit('fileMessage',{...myInfo,fileName:f.name,size:f.size,dataUrl:r.result});}; r.readAsDataURL(f); document.getElementById('fileIn').value='';}
function openModal(url,name){document.getElementById('modalImg').src=url; document.getElementById('modalDown').href=url; document.getElementById('modalDown').download=name; document.getElementById('imgModal').classList.add('show');}
function closeModal(e){if(e.target.id==='imgModal'||e.target.id==='modalImg') document.getElementById('imgModal').classList.remove('show');}
let rec,chunks=[],startT;
async function toggleVoice(){
 const btn=document.getElementById('micBtn');
 if(rec&&rec.state==='recording'){rec.stop(); btn.textContent='🎤'; btn.style.background=''; return;}
 try{
 const stream=await navigator.mediaDevices.getUserMedia({audio:true});
 rec=new MediaRecorder(stream); chunks=[]; startT=Date.now();
 rec.ondataavailable=e=>chunks.push(e.data);
 rec.onstop=()=>{const blob=new Blob(chunks,{type:'audio/webm'}); const r=new FileReader(); r.onload=()=>{socket.emit('voiceMessage',{...myInfo,dataUrl:r.result,duration:Math.round((Date.now()-startT)/1000)});}; r.readAsDataURL(blob); stream.getTracks().forEach(t=>t.stop());};
 rec.start(); btn.textContent='⏹'; btn.style.background='#ff4444';
 }catch(e){alert('마이크 권한 필요!');}
}
renderLogin();
</script>
