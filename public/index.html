

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="/manifest.json?v=2">
<link rel="apple-touch-icon" href="/my-icon-180.png?v=2">
<title>플로우갓의 채팅방</title>
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#fff;height:100dvh;display:flex;justify-content:center;align-items:center;margin:0;padding:0;padding-top:env(safe-area-inset-top)}
  .app{width:100%;max-width:420px;height:100dvh;height:calc(100dvh - env(safe-area-inset-top));background:#fff;display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:none}
  @media(min-width:500px){.app{height:90dvh;border-radius:24px}}
  .header{background:#ffffffcc;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:8px;border-bottom:1px solid #f0f0f0;position:sticky;top:0;z-index:10}
  .headerTop{display:flex;justify-content:space-between;align-items:center}
  .header b{font-size:17px}
  .bgmBar{display:flex;align-items:center;gap:8px;background:#f5f5f5;padding:8px 12px;border-radius:12px;font-size:13px}
  .bgmBar select{padding:4px 8px;border-radius:8px;border:1px solid #ddd;font-size:12px}
  .bgmBar input[type=range]{flex:1;max-width:90px}
  .bgmBar button{padding:4px 8px;border:none;border-radius:8px;background:#fff;border:1px solid #ddd;cursor:pointer;font-size:12px}
  .login{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px;gap:16px;background:#fff}
  .login h1{font-size:24px}
  .login input, .login select{padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px}
  .login button{padding:14px;background:#FEE500;border:none;border-radius:12px;font-weight:700;font-size:16px;cursor:pointer}
  .chars{display:flex;gap:8px;flex-wrap:wrap}
  .char{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:#f5f5f5;cursor:pointer;border:2px solid transparent}
  .char.sel{border-color:#000;background:#FEE500}
  .messages{flex:1;overflow-y:auto;padding:16px;background:#ABC1D1;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:78%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.5;position:relative;white-space:pre-wrap;word-break:keep-all;overflow-wrap:break-word}
  .msg.me{align-self:flex-end;background:#FEE500;border-bottom-right-radius:4px}
  .msg.other{align-self:flex-start;background:#fff;border-bottom-left-radius:4px}
  .msg .sender{font-size:12px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:4px}
  .msg.me .sender{justify-content:flex-end;color:#5a4a00}
  .msg.other .sender{color:#000}
  .meta{font-size:11px;color:#666;margin-top:4px;text-align:right}
  .system{align-self:center;background:rgba(0,0,0,.2);color:#fff;padding:4px 12px;border-radius:20px;font-size:12px}
  .inputArea{display:flex;gap:8px;padding:10px;background:#fff;border-top:1px solid #eee;align-items:center}
  .inputArea input{flex:1;padding:12px 16px;border:none;background:#f2f2f2;border-radius:24px;font-size:15px;outline:none}
  .iconBtn{width:40px;height:40px;border-radius:50%;border:none;background:#f2f2f2;display:grid;place-items:center;font-size:18px;cursor:pointer}
  .send{background:#FEE500}
</style>
</head>
<body>
<div class="app" id="app"></div>
<audio id="bgmPlayer" loop preload="auto"></audio>
<audio id="enterSound" preload="auto" src="/enter.mp3"></audio>
<script src="/socket.io/socket.io.js"></script>
<script>
const appEl = document.getElementById('app');
let socket, myInfo, roomId='main-room';
let state='login';
let isComposing = false;
let isHost = false;
let currentTrack = localStorage.getItem('lastBgmTrack') || 'bgm1.mp3';
let myVolume = parseFloat(localStorage.getItem('myBgmVolume') || '0.5');
const bgmList = ['bgm1.mp3','bgm2.mp3','bgm3.mp3','bgm4.mp3','bgm5.mp3'];
function renderLogin(){
 appEl.innerHTML=`
 <div class="login">
  <h1>🐣 플로우갓의 채팅 입장</h1>
  <p style="color:#666;font-size:14px">아이폰·갤럭시 둘 다 설치 가능! 플로우갓의 채팅방</p>
  <input id="nameIn" placeholder="내 이름 (예: 지훈) - '방장' 포함하면 방장" />
  <div>
    <p style="font-size:13px;margin-bottom:8px">내 캐릭터 선택</p>
    <div class="chars" id="chars"></div>
  </div>
  <input id="roomIn" placeholder="방 이름 (예: 우리반) - 기본: main-room" value="main-room"/>
  <button onclick="enter()">입장하기 →</button>
  <p style="font-size:12px;color:#888;margin-top:12px;line-height:1.5">
  📱 설치 방법<br>
  아이폰: Safari에서 공유 버튼 → 홈 화면에 추가<br>
  갤럭시: Chrome에서 메뉴 → 홈 화면에 추가 / 앱 설치
  </p>
 </div>`;
 const emojis=['🐻','🐱','🐶','🐰','🦊','🐼','🐨','🐯','🐸','🐵','🦁','🐧'];
 let sel=emojis[0];
 const wrap=document.getElementById('chars');
 emojis.forEach(e=>{
   const d=document.createElement('div'); d.className='char'+(e===sel?' sel':''); d.textContent=e;
   d.onclick=()=>{sel=e; document.querySelectorAll('.char').forEach(c=>c.classList.remove('sel')); d.classList.add('sel')};
   wrap.appendChild(d);
 });
 window._sel=()=>sel;
}
function enter(){
 const name=document.getElementById('nameIn').value.trim();
 if(!name) return alert('이름 입력해줘');
 const room=document.getElementById('roomIn').value.trim()||'main-room';
 roomId=room;
 myInfo={username:name, character:window._sel(), roomId};
 // 방장 판별: 이름에 방장/플로우갓 포함 or 첫 입장자
 isHost = name.includes('방장') || name.includes('플로우갓') || name.includes('관리자');
 if(isHost) localStorage.setItem('isHost-'+roomId, '1');
 else if(localStorage.getItem('isHost-'+roomId)) isHost = true;
 
 state='chat';
 initSocket();
 renderChat();
 initBgm();
}
let enterSoundEnabled = localStorage.getItem('enterSoundEnabled') !== '0';
function playEnterSound(){
 if(!enterSoundEnabled) return;
 try{
   const enterEl = document.getElementById('enterSound');
   // 1순위: mp3 파일이 있으면 그걸 재생
   if(enterEl && enterEl.src){
     enterEl.volume = Math.min(0.8, myVolume+0.2);
     enterEl.currentTime = 0;
     enterEl.play().catch(()=>{ playBeepFallback(); });
   } else {
     playBeepFallback();
   }
 }catch(e){ playBeepFallback(); }
}
function playBeepFallback(){
 try{
   const ctx = new (window.AudioContext || window.webkitAudioContext)();
   const vol = ctx.createGain();
   vol.gain.value = myVolume * 0.6;
   vol.connect(ctx.destination);
   // 띠링~ 두 번
   [0, 150].forEach((delay, idx)=>{
     setTimeout(()=>{
       const osc = ctx.createOscillator();
       osc.type = 'sine';
       osc.frequency.value = idx===0? 800: 1200;
       osc.connect(vol);
       osc.start();
       osc.stop(ctx.currentTime+0.25);
     }, delay);
   });
 }catch(e){}
}
function initSocket(){
 socket=io();
 socket.emit('joinRoom', myInfo);
 socket.on('chatMessage', (data)=>{
   addMsg(data);
   // 내 메시지가 아니면 알림음? 필요하면 주석 해제
   // if(data.username !== myInfo.username) playEnterSound();
 });
 socket.on('fileMessage', addFileMsg);
 socket.on('voiceMessage', addVoiceMsg);
 socket.on('systemMessage', (txt)=>{
   addSystem(txt);
   // "들어왔습니다" / "입장" 포함하면 입장 알람!
   if(txt.includes('들어왔') || txt.includes('입장') || txt.includes('joined')){
     if(!txt.includes(myInfo.username)) playEnterSound();
   }
 });
 socket.on('userJoined', (data)=>{
   // 서버에서 userJoined 이벤트 보내면 여기로 옴
   if(data.username !== myInfo.username){
     addSystem(`🔔 ${data.character||'🐣'} ${data.username}님이 들어왔습니다.`);
     playEnterSound();
   }
 });
 socket.on('userLeft', (data)=>{
   addSystem(`👋 ${data.username}님이 나갔습니다.`);
 });
 // BGM 트랙 변경은 방장만 - 전체에 동기화 (볼륨은 동기화 안함!)
 socket.on('bgmTrackChange', (track)=>{
   if(bgmList.includes(track)){
     currentTrack = track;
     const player = document.getElementById('bgmPlayer');
     const wasPlaying = !player.paused;
     player.src = '/'+track;
     localStorage.setItem('lastBgmTrack', track);
     updateBgmSelect();
     if(wasPlaying) player.play().catch(()=>{});
     addSystem(`🎵 BGM 변경: ${track} (방장)`);
   }
 });
 socket.on('hostAssigned', (data)=>{
   if(data.username === myInfo.username){
     isHost = true;
     localStorage.setItem('isHost-'+roomId, '1');
     renderBgmBar();
   }
 });
}
function renderChat(){
 appEl.innerHTML=`
  <div class="header">
    <div class="headerTop"><b>${myInfo.character} ${myInfo.username} · ${roomId} ${isHost?'👑':''}</b><span style="font-size:12px;color:#888">${location.hostname}</span></div>
    <div id="bgmBarWrap"></div>
  </div>
  <div class="messages" id="msgs"></div>
  <div class="inputArea">
   <button class="iconBtn" onclick="document.getElementById('fileIn').click()">📎</button>
   <input id="fileIn" type="file" hidden onchange="sendFile(this.files[0])"/>
   <input id="textIn" placeholder="메시지 입력" autocomplete="off" />
   <button class="iconBtn" id="micBtn" onclick="toggleVoice()">🎤</button>
   <button class="iconBtn send" onclick="sendText()">↑</button>
  </div>`;
 const textIn = document.getElementById('textIn');
 textIn.focus();
 textIn.addEventListener('compositionstart', ()=>{ isComposing = true; });
 textIn.addEventListener('compositionend', ()=>{ setTimeout(()=>{ isComposing = false; }, 100); });
 textIn.addEventListener('keydown', (e)=>{
   if(e.key === 'Enter'){
     if(isComposing || e.isComposing || e.keyCode === 229) return;
     e.preventDefault(); sendText();
   }
 });
 if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
 renderBgmBar();
}
function renderBgmBar(){
 const wrap = document.getElementById('bgmBarWrap');
 if(!wrap) return;
 const hostControls = isHost ? `
   <select id="bgmSelect" onchange="changeTrack(this.value)">
     ${bgmList.map(t=>`<option value="${t}" ${t===currentTrack?'selected':''}>${t}</option>`).join('')}
   </select>
   <span style="font-size:11px;color:#666">방장 전용</span>
 ` : `<span style="font-size:12px">🎵 ${currentTrack} ${isHost?'':'(방장만 변경 가능)'}</span>`;
 wrap.innerHTML = `
  <div class="bgmBar">
    <button id="bgmPlayBtn" onclick="toggleBgm()">▶️</button>
    ${hostControls}
    <span style="margin-left:auto;font-size:11px">🔊</span>
    <input type="range" id="volSlider" min="0" max="1" step="0.01" value="${myVolume}" oninput="changeMyVolume(this.value)">
    <button onclick="toggleBgmMute()">🔇</button>
    <button onclick="toggleEnterSound()" id="enterBtn" style="margin-left:4px">${enterSoundEnabled?'🔔':'🔕'}</button>
  </div>
  <div style="font-size:10px;color:#888;margin-top:4px">🔊 볼륨은 개인 설정 | 🎵 곡 변경은 방장만 | 🔔 입장 알람 ${enterSoundEnabled?'ON':'OFF'}</div>
 `;
}
function toggleEnterSound(){
 enterSoundEnabled = !enterSoundEnabled;
 localStorage.setItem('enterSoundEnabled', enterSoundEnabled?'1':'0');
 const btn = document.getElementById('enterBtn');
 if(btn) btn.textContent = enterSoundEnabled?'🔔':'🔕';
 if(enterSoundEnabled) playEnterSound(); // 테스트
}
function updateBgmSelect(){
 const sel = document.getElementById('bgmSelect');
 if(sel) sel.value = currentTrack;
}
function initBgm(){
 const player = document.getElementById('bgmPlayer');
 player.src = '/'+currentTrack;
 player.volume = myVolume;
 // 자동재생 시도 (브라우저 정책으로 실패할 수 있음 - 버튼으로 재생)
 player.play().catch(()=>{ console.log('자동재생 차단 - 버튼 눌러주세요'); });
}
function toggleBgm(){
 const player = document.getElementById('bgmPlayer');
 if(player.paused){
   player.play().then(()=>{ document.getElementById('bgmPlayBtn').textContent='⏸️'; }).catch(()=>{});
 } else {
   player.pause();
   document.getElementById('bgmPlayBtn').textContent='▶️';
 }
}
function changeTrack(newTrack){
 if(!isHost) return alert('BGM 변경은 방장만 가능해!');
 if(!bgmList.includes(newTrack)) return;
 currentTrack = newTrack;
 const player = document.getElementById('bgmPlayer');
 const wasPlaying = !player.paused;
 player.src = '/'+newTrack;
 localStorage.setItem('lastBgmTrack', newTrack);
 if(wasPlaying) player.play().catch(()=>{});
 // 서버에 트랙 변경 알림 - 볼륨은 절대 보내지 않음!
 socket.emit('bgmTrackChange', newTrack);
 addSystem(`🎵 BGM 변경: ${newTrack}`);
}
function changeMyVolume(val){
 myVolume = parseFloat(val);
 const player = document.getElementById('bgmPlayer');
 player.volume = myVolume;
 localStorage.setItem('myBgmVolume', myVolume);
 // 절대 서버로 전송 안함! 개인 볼륨!
}
function toggleBgmMute(){
 const player = document.getElementById('bgmPlayer');
 const slider = document.getElementById('volSlider');
 if(player.volume > 0){
   slider.dataset.prev = player.volume;
   changeMyVolume(0);
   slider.value = 0;
 } else {
   const prev = parseFloat(slider.dataset.prev || '0.5');
   changeMyVolume(prev);
   slider.value = prev;
 }
}
function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function addMsg(data){
 const isMe=data.username===myInfo.username;
 const el=document.createElement('div');
 el.className=isMe?'msg me':'msg other';
 const safeText = escapeHtml(data.text);
 el.innerHTML=`<div class="sender">${data.character} ${escapeHtml(data.username)}</div><div>${safeText}</div><div class="meta">${new Date(data.id).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}</div>`;
 document.getElementById('msgs').appendChild(el); scroll();
}
function addSystem(txt){
 const el=document.createElement('div'); el.className='system'; el.textContent=txt;
 const msgs = document.getElementById('msgs');
 if(msgs){ msgs.appendChild(el); scroll(); }
}
function addFileMsg(data){
 const isMe=data.username===myInfo.username;
 const el=document.createElement('div'); el.className=isMe?'msg me':'msg other';
 el.innerHTML=`<div class="sender">${data.character} ${escapeHtml(data.username)}</div><div>📄 ${escapeHtml(data.fileName)} (${(data.size/1024).toFixed(1)}KB)</div><a href="${data.dataUrl}" download="${data.fileName}" style="font-size:12px;color:#007AFF">다운로드</a>`;
 document.getElementById('msgs').appendChild(el); scroll();
}
function addVoiceMsg(data){
 const isMe=data.username===myInfo.username;
 const el=document.createElement('div'); el.className=isMe?'msg me':'msg other';
 el.innerHTML=`<div class="sender">${data.character} ${escapeHtml(data.username)}</div><div style="display:flex;align-items:center;gap:8px"><button onclick="new Audio('${data.dataUrl}').play()">▶</button><div style="flex:1;height:4px;background:rgba(0,0,0,.1);border-radius:2px"><div style="width:100%;height:100%;background:#000;border-radius:2px;opacity:.2"></div></div><span style="font-size:12px">${data.duration}s</span></div>`;
 document.getElementById('msgs').appendChild(el); scroll();
}
function scroll(){ const m=document.getElementById('msgs'); if(m) m.scrollTop=m.scrollHeight; }
function sendText(){
 if(isComposing) return;
 const inp=document.getElementById('textIn'); 
 let t=inp.value.trim(); 
 if(!t) return;
 t = t.replace(/\s+/g, ' ');
 socket.emit('chatMessage',{...myInfo, text:t}); 
 inp.value='';
 inp.focus();
}
function sendFile(f){
 if(!f) return; const r=new FileReader(); r.onload=()=>{ socket.emit('fileMessage',{...myInfo, fileName:f.name, size:f.size, dataUrl:r.result}); }; r.readAsDataURL(f);
}
let rec, chunks=[], startT;
async function toggleVoice(){
 const btn=document.getElementById('micBtn');
 if(rec && rec.state==='recording'){ rec.stop(); btn.textContent='🎤'; btn.style.background=''; btn.style.color=''; return; }
 const stream=await navigator.mediaDevices.getUserMedia({audio:true});
 rec=new MediaRecorder(stream); chunks=[]; startT=Date.now();
 rec.ondataavailable=e=>chunks.push(e.data);
 rec.onstop=()=>{ const blob=new Blob(chunks,{type:'audio/webm'}); const r=new FileReader(); r.onload=()=>{ socket.emit('voiceMessage',{...myInfo, dataUrl:r.result, duration:Math.round((Date.now()-startT)/1000)}); }; r.readAsDataURL(blob); };
 rec.start(); btn.textContent='⏹'; btn.style.background='#ff4444'; btn.style.color='#fff';
}
renderLogin();
</script>
</body>
</html>
